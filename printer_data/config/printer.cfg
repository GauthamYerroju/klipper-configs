# CONFIG BY KANROG87
#
# This config is based on the Fabreeko-Kit with 300mm Z-extrusions and rods, and using my Sentinel toolhead with the probe mod.
#
# This file contains common pin mappings for the BIGTREETECH SKR mini E3 v3.0

# See docs/Config_Reference.md for a description of parameters.

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

# [include adxl.cfg] ## For those who use an ac0.25098celerometer to measure resonances for input shaper, make sure your file is set up for your device.
# [include mainsail.cfg]
[include macros_1.cfg] ## Go through these and check that they match your setup #!#
[include macros_2.cfg] ## Only one line to change here.
[include macros_torture.cfg] ## Torture macros for troubleshooting
[include macros_homing.cfg] ## Macros to help you get the homing dialed in. #!#

#====================================================================
# Serial Connection ## Make sure this matches the output from the command "ls /dev/serial/by-id/*" on your klipper machine/pi #!#
#====================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3A00360015504B5735313920-if00

#====================================================================
# PRINTER LIMIT SETTINGS ## These are set higher than needed, mostly for diagnosing and testing.
#====================================================================
[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000 #35000 #39000
max_z_velocity: 50
max_z_accel: 2000

#====================================================================
# X STEPPER ## Fabreeko HoneyBadger 40mm Motor ## Right motor
#====================================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 127
position_min: -80
position_max: 128
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False
diag_pin: ^PC0    # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 141 # 255 is most sensitive value, 0 is least sensitive ## Change only if sensorless homing needs adjusting #!#

#====================================================================
# Y STEPPER ## Fabreeko HoneyBadger 40mm Motor ## Left motor
#====================================================================
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 123 ## change (+/-) to make sure Y0 is at the edge of your bed #!#
position_max: 135 ## match the value in "position_endstop:" #!#
position_min: -270
# 154 includes the z-idler
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: False
diag_pin: ^PC1
driver_SGTHRS: 141 # 255 is most sensitive value, 0 is least sensitive ## Change only if sensorless homing needs adjusting #!#

#====================================================================
# Z STEPPER ## Fabreeko HoneyBadger 40mm Motor
#====================================================================
## Please note that my Z-extrusions and rail is 300mm and im using my ABL-mod for the Sentinel toolhead.
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
# endstop_pin: PC2 # probe:z_virtual_endstop ## Change to "PC2" if using a normal endstop #!#
# position_endstop: 125.05 ## Uncomment if using endstop and set to lowest point where your bed hits the switch, also remove [probe] section. #!#
position_max: 126 ## Change to lowest point your bed can move #!#
position_min: -1
homing_speed: 30
#second_homing_speed: 5
homing_retract_dist: 10
homing_retract_speed: 10
gear_ratio: 4:1 ## Comment out if you are not using geared Z  #!#

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 9999999
interpolate: False

#====================================================================
# EXTRUDER ## Fabreeko HoneyBadger 20mm Pancake motor and Fabreeko Sherpa kit  ## Change to suit your extruder-setup #!#
#====================================================================
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
rotation_distance: 4.637 # Orbiter v2
# gear_ratio: 7.5:1 ## for sherpa mini 8t motor
microsteps: 16
full_steps_per_rotation: 200 ## 1.8deg Motor
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: -100
min_extrude_temp: 0
max_temp: 300000
#pressure_advance: 0.025 ## Fabreeko kit / Trianglelabs CHC
#pressure_advance_smooth_time: 0.025
max_extrude_cross_section: 50
max_extrude_only_distance: 500
max_extrude_only_velocity: 120

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
# run_current: 0.7
# sense_resistor: 0.110
# stealthchop_threshold: 0
# interpolate: False

interpolate: true
run_current: 0.85 #**
hold_current: 0.100
sense_resistor: 0.11 #**
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

#====================================================================
# BED HEATER ## LDO 100W Voron V0 Bed with FYSETC PEI/Carbon sheet ## Change to suit your bed-setup #!#
#====================================================================
[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

#====================================================================
# FANS
#====================================================================
[heater_fan hotend_fan] ## FAN1
pin: PC6
heater: extruder
heater_temp: 35.0
fan_speed: 0.5

[fan] ## FAN3 (Part-cooling)
pin: PC7

#  Select between auxiliary cooling fan or controller fan on the FAN2 port: #!#
# if using the auxiliary part-cooling fan, make sure you have a fan connected to 24v to cool your controller.

[include fan_controller.cfg]
#[include fan_aux.cfg]

#====================================================================
# LED
#====================================================================
[neopixel Hotend_Light]
pin: PA8
chain_count: 1
initial_RED: 1.0
initial_GREEN: 0.78
initial_BLUE: 0.5

#====================================================================
# AUTOMATIC BED LEVELING  ##  Only if you are using my ABL probe mod for the sentinel #!#
#====================================================================
